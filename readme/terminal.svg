<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="title description">
  <title id="title">Two-row preparation example</title>
  <desc id="description">A local fixture run saves two CSV rows as a response plan and prints the command to preview it. Nothing was submitted.</desc>
  <rect width="900" height="270" rx="14" fill="#162a25"/>
  <path d="M14 0h872a14 14 0 0 1 14 14v46H0V14A14 14 0 0 1 14 0z" fill="#f8f5eb"/>
  <rect x="28" y="21" width="17" height="17" rx="3" fill="#205949"/>
  <path d="m32 30 3 3 6-7" fill="none" stroke="#f8f5eb" stroke-width="1.75" stroke-linecap="round"/>
  <text x="60" y="37" fill="#162a25" font-size="23" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Two-row rehearsal</text>
  <text x="872" y="36" text-anchor="end" fill="#205949" font-size="17" font-family="Segoe UI,Arial,sans-serif">Offline form fixture</text>
  <path d="M42 165h816" stroke="#50766b" stroke-width="1"/>
  <g font-family="Consolas, Menlo, monospace" font-size="24">
    <text x="42" y="110" fill="#f18e71">›</text>
    <text x="67" y="110" fill="#f8f5eb">python -m gformbot prepare</text>
<text x="67" y="142" fill="#ccddcf">&quot;YOUR_RESPONDER_URL&quot; --data answers.csv -n 2</text>
<text x="42" y="199" fill="#edf5e9">Answers saved: gformbot-responses.json</text>
<text x="42" y="232" fill="#edf5e9">Ready. Open with: gformbot preview &quot;gformbot-responses.json&quot;</text>
  </g>
</svg>
