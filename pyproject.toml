[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gformbot"
version = "0.4.0.dev0"
description = "Generate, prepare, and fill Google Forms responses with ChatGPT or supplied data."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "yogeshkrishna" }]
keywords = ["google-forms", "automation", "selenium", "cli", "bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
clipboard = ["pyperclip"]
dev = [
    "pytest",
    "build",
    "twine",
    "ruff>=0.9,<1",
]

[project.urls]
Homepage = "https://github.com/yogeshkrishna/google_form_test_bot"
Repository = "https://github.com/yogeshkrishna/google_form_test_bot"
"Bug Tracker" = "https://github.com/yogeshkrishna/google_form_test_bot/issues"

[project.scripts]
gformbot = "gformbot:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: opens a visible local browser session"]

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["gformbot/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
