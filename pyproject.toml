[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gformbot"
version = "0.4.1"
description = "Generate, prepare, and submit Google Forms responses with ChatGPT or supplied data."
readme = "README.md"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "LICENSE-chatgpt-protocol"]
authors = [{ name = "yogeshkrishna" }]
keywords = ["google-forms", "automation", "http", "cli", "bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1,<9",
    "pyyaml>=6.0,<7",
    "rich>=13.0,<16",
    "InquirerPy>=0.3.4,<0.4",
    "certifi>=2026.2.25",
    "urllib3>=2.6.3,<3",
]

[project.optional-dependencies]
clipboard = ["pyperclip"]
dev = [
    "pytest",
    "build",
    "twine",
    "ruff>=0.9,<1",
]

[project.urls]
Homepage = "https://github.com/yogeshkrishna/google_form_test_bot"
Repository = "https://github.com/yogeshkrishna/google_form_test_bot"
"Bug Tracker" = "https://github.com/yogeshkrishna/google_form_test_bot/issues"

[project.scripts]
gformbot = "gformbot:main"

[tool.setuptools]
packages = ["gformbot"]
include-package-data = false

[tool.setuptools.package-data]
gformbot = ["editor.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
