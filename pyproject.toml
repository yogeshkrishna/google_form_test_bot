[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gformbot"
version = "0.3.0"
description = "Prepare validated Google Forms responses with ChatGPT or CSV data, preview, and fill from your terminal."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "yogeshkrishna" }]
keywords = ["google-forms", "automation", "selenium", "cli", "bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.10"

dependencies = [
    "selenium>=4.25,<5",
    "click>=8.1,<9",
    "pyyaml>=6.0,<7",
    "rich>=13.0,<15",
    "InquirerPy>=0.3.4,<0.4",
]

[project.optional-dependencies]
clipboard = ["pyperclip"]
dev = [
    "pytest",
    "build",
    "twine",
    "ruff>=0.9,<1",
]

[project.urls]
Homepage = "https://github.com/yogeshkrishna/google_form_test_bot"
Repository = "https://github.com/yogeshkrishna/google_form_test_bot"
"Bug Tracker" = "https://github.com/yogeshkrishna/google_form_test_bot/issues"

[project.scripts]
gformbot = "gformbot:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gformbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: starts a local headless Chrome session"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
