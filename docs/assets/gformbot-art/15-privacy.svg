<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="t d"><title id="t">Know what you share</title><desc id="d">Review the information you provide when using AI mode.</desc><rect width="1600" height="400" rx="24" fill="#F7F4EC"/><circle cx="1490" cy="20" r="170" fill="#E4EAF8"/><text x="65" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#686B6D">AI AND PRIVACY</text><text x="65" y="111" font-family="Georgia, serif" font-size="43" font-weight="700" fill="#252A31">Know what you share</text><text x="67" y="147" font-family="Arial, sans-serif" font-size="17" fill="#686B6D">Review the information you provide when using AI mode.</text><rect x="65.0" y="185" width="476.6666666666667" height="150" rx="16" fill="#FFFDF8" stroke="#D8D1C6" stroke-width="2"/><circle cx="93.0" cy="215" r="7" fill="#3157C8"/><text x="113.0" y="222" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#252A31">AI mode</text><text x="93.0" y="269" font-family="Arial, sans-serif" font-size="15" fill="#686B6D">Form details may leave your device.</text><path d="M93.0 296h55" stroke="#3157C8" stroke-width="3" stroke-linecap="round"/><rect x="561.6666666666667" y="185" width="476.6666666666667" height="150" rx="16" fill="#FFFDF8" stroke="#D8D1C6" stroke-width="2"/><circle cx="589.6666666666667" cy="215" r="7" fill="#D47B6C"/><text x="609.6666666666667" y="222" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#252A31">Local files</text><text x="589.6666666666667" y="269" font-family="Arial, sans-serif" font-size="15" fill="#686B6D">Plans and logs can contain answers.</text><path d="M589.6666666666667 296h55" stroke="#3157C8" stroke-width="3" stroke-linecap="round"/><rect x="1058.3333333333335" y="185" width="476.6666666666667" height="150" rx="16" fill="#FFFDF8" stroke="#D8D1C6" stroke-width="2"/><circle cx="1086.3333333333335" cy="215" r="7" fill="#3157C8"/><text x="1106.3333333333335" y="222" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#252A31">Review</text><text x="1086.3333333333335" y="269" font-family="Arial, sans-serif" font-size="15" fill="#686B6D">Use fictional data for your tests.</text><path d="M1086.3333333333335 296h55" stroke="#3157C8" stroke-width="3" stroke-linecap="round"/></svg>