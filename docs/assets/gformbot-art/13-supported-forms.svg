<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="t d"><title id="t">Built for different question types</title><desc id="d">The supported inputs are detailed in the table below.</desc><rect width="1600" height="400" rx="24" fill="#F7F4EC"/><circle cx="1490" cy="20" r="170" fill="#E4EAF8"/><text x="65" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#686B6D">FORM COVERAGE</text><text x="65" y="111" font-family="Georgia, serif" font-size="43" font-weight="700" fill="#252A31">Built for different question types</text><text x="67" y="147" font-family="Arial, sans-serif" font-size="17" fill="#686B6D">The supported inputs are detailed in the table below.</text><rect x="65.0" y="185" width="352.5" height="150" rx="16" fill="#FFFDF8" stroke="#D8D1C6" stroke-width="2"/><circle cx="93.0" cy="215" r="7" fill="#3157C8"/><text x="113.0" y="222" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#252A31">Text</text><text x="93.0" y="269" font-family="Arial, sans-serif" font-size="15" fill="#686B6D">Short answers and paragraphs.</text><path d="M93.0 296h55" stroke="#3157C8" stroke-width="3" stroke-linecap="round"/><rect x="437.5" y="185" width="352.5" height="150" rx="16" fill="#FFFDF8" stroke="#D8D1C6" stroke-width="2"/><circle cx="465.5" cy="215" r="7" fill="#D47B6C"/><text x="485.5" y="222" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#252A31">Choices</text><text x="465.5" y="269" font-family="Arial, sans-serif" font-size="15" fill="#686B6D">Multiple choice and checkboxes.</text><path d="M465.5 296h55" stroke="#3157C8" stroke-width="3" stroke-linecap="round"/><rect x="810.0" y="185" width="352.5" height="150" rx="16" fill="#FFFDF8" stroke="#D8D1C6" stroke-width="2"/><circle cx="838.0" cy="215" r="7" fill="#3157C8"/><text x="858.0" y="222" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#252A31">Ratings</text><text x="838.0" y="269" font-family="Arial, sans-serif" font-size="15" fill="#686B6D">Scales and icon ratings.</text><path d="M838.0 296h55" stroke="#3157C8" stroke-width="3" stroke-linecap="round"/><rect x="1182.5" y="185" width="352.5" height="150" rx="16" fill="#FFFDF8" stroke="#D8D1C6" stroke-width="2"/><circle cx="1210.5" cy="215" r="7" fill="#D47B6C"/><text x="1230.5" y="222" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#252A31">More</text><text x="1210.5" y="269" font-family="Arial, sans-serif" font-size="15" fill="#686B6D">Dates, grids and sections.</text><path d="M1210.5 296h55" stroke="#3157C8" stroke-width="3" stroke-linecap="round"/></svg>