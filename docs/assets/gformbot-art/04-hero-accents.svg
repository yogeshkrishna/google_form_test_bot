<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">GFormBot animated hero accents</title>
<desc id="desc">A slow cobalt dotted route with a traveling point, a soft coral star, and small paper marks. No script or external assets.</desc>
<path d="M104 279C250 126 408 152 538 232S785 294 904 174 1040 98 1112 127" fill="none" stroke="#D8D1C6" stroke-width="2" stroke-dasharray="2 14" stroke-linecap="round"/>
