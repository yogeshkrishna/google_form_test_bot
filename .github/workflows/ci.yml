name: CI

"on":
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q -m "not browser"
      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m ruff check .
      - name: Formatting
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m ruff format --check .
      - name: Verify pinned vendor recipe
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python tools/vendor_selenium.py --check

  distributions:
    name: Build and install wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/check_wheel.py dist
      - name: Smoke-test the installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/gformbot-wheel"
          if [ "$RUNNER_OS" = "Windows" ]; then
            WHEEL_PYTHON="$RUNNER_TEMP/gformbot-wheel/Scripts/python.exe"
          else
            WHEEL_PYTHON="$RUNNER_TEMP/gformbot-wheel/bin/python"
          fi
          "$WHEEL_PYTHON" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$WHEEL_PYTHON" -m pip check
          "$WHEEL_PYTHON" -m gformbot --version
          "$WHEEL_PYTHON" -m gformbot --help
          for command in generate prepare preview doctor config log; do
            "$WHEEL_PYTHON" -m gformbot "$command" --help
          done
      - uses: actions/upload-artifact@v7
        with:
          name: distributions-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Local ${{ matrix.browser }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, browser: chrome}
          - {os: windows-latest, browser: chrome}
          - {os: windows-latest, browser: edge}
          - {os: windows-latest, browser: firefox}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GFORMBOT_BROWSER_TESTS: "1"
      GFORMBOT_TEST_BROWSER: ${{ matrix.browser }}
      SE_AVOID_STATS: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[dev]"
      - run: google-chrome --version
        if: runner.os == 'Linux'
      - run: python -m pytest -q -m browser
