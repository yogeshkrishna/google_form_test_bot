name: CI

"on":
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q -m "not browser"
      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m ruff check .
      - name: Formatting
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m ruff format --check .
      - name: Verify pinned vendor recipe
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python tools/vendor_selenium.py --check

  distributions:
    name: Build and install wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build twine
      - name: Use the commit timestamp for repeatable wheels
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/check_wheel.py dist
      - name: Rebuild the wheel identically
        run: |
          python -m build --wheel --outdir reproduced
          python -c "from pathlib import Path; wheels=list(Path('dist').glob('*.whl')); assert all(p.read_bytes() == (Path('reproduced')/p.name).read_bytes() for p in wheels); print('Wheel bytes reproduce exactly')"
      - name: Smoke-test the installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/gformbot-wheel"
          if [ "$RUNNER_OS" = "Windows" ]; then
            WHEEL_PYTHON="$RUNNER_TEMP/gformbot-wheel/Scripts/python.exe"
          else
            WHEEL_PYTHON="$RUNNER_TEMP/gformbot-wheel/bin/python"
          fi
          WHEEL_FILE="$(python -c "from pathlib import Path; print(next(Path('dist').glob('*.whl')).resolve())")"
          "$WHEEL_PYTHON" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$WHEEL_PYTHON" -m pip check
          "$WHEEL_PYTHON" -m gformbot --version
          "$WHEEL_PYTHON" -m gformbot --help
          for command in generate prepare preview doctor config log; do
            "$WHEEL_PYTHON" -m gformbot "$command" --help
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$WHEEL_PYTHON" -c "import importlib.util; from gformbot.selenium_runtime import PACKAGE; assert PACKAGE == 'gformbot._vendor.selenium'; assert importlib.util.find_spec('selenium') is None; assert importlib.util.find_spec('typing_extensions') is None"
            "$WHEEL_PYTHON" -m pip install selenium==4.51.0
            "$WHEEL_PYTHON" -c "from selenium.common.exceptions import WebDriverException as official; from gformbot.selenium_runtime import WebDriverException as bundled; assert official is not bundled; from selenium import webdriver; assert webdriver.Chrome.__module__.startswith('selenium.')"
            "$WHEEL_PYTHON" -m pip uninstall -y gformbot
            "$WHEEL_PYTHON" -c "import importlib.util, selenium; assert importlib.util.find_spec('gformbot') is None; assert selenium.__version__ == '4.51.0'"
            "$WHEEL_PYTHON" -m pip install --no-deps "$WHEEL_FILE"
            "$WHEEL_PYTHON" -m pip check
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: distributions-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Local ${{ matrix.browser }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, browser: chrome}
          - {os: windows-latest, browser: chrome}
          - {os: windows-latest, browser: edge}
          - {os: windows-latest, browser: firefox}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GFORMBOT_BROWSER_TESTS: "1"
      GFORMBOT_TEST_BROWSER: ${{ matrix.browser }}
      SE_AVOID_STATS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[dev]"
      - run: google-chrome --version
        if: runner.os == 'Linux'
      - run: python -m pytest -q -m browser
