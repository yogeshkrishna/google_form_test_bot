name: CI

"on":
  push:
    branches: [master, fix/guided-submission]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-24.04-arm
            python: "3.12"
          - os: macos-15-intel
            python: "3.12"
          - os: macos-15
            python: "3.12"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m ruff check .
      - name: Formatting
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m ruff format --check .

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build twine
      - name: Use the commit timestamp for repeatable wheels
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/check_wheel.py dist
      - name: Rebuild the wheel identically
        run: |
          python -m build --wheel --outdir reproduced
          python -c "from pathlib import Path; wheels=list(Path('dist').glob('*.whl')); assert all(p.read_bytes() == (Path('reproduced')/p.name).read_bytes() for p in wheels); print('Wheel bytes reproduce exactly')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  distributions:
    name: Build and install wheel / ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-15]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Smoke-test the installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/gformbot-wheel"
          if [ "$RUNNER_OS" = "Windows" ]; then
            WHEEL_BIN="$RUNNER_TEMP/gformbot-wheel/Scripts"
            WHEEL_PYTHON="$WHEEL_BIN/python.exe"
            WHEEL_ENTRY="$WHEEL_BIN/gformbot.exe"
          else
            WHEEL_BIN="$RUNNER_TEMP/gformbot-wheel/bin"
            WHEEL_PYTHON="$WHEEL_BIN/python"
            WHEEL_ENTRY="$WHEEL_BIN/gformbot"
          fi
          WHEEL_FILE="$(python -c "from pathlib import Path; print(next(Path('dist').glob('*.whl')).resolve())")"
          "$WHEEL_PYTHON" -m pip install "$WHEEL_FILE"
          cp -R tests "$RUNNER_TEMP/gformbot-wheel-tests"
          cd "$RUNNER_TEMP"
          "$WHEEL_PYTHON" -m pip check
          "$WHEEL_ENTRY" --version
          # The module command also works when the launcher directory is not on PATH.
          PATH="" "$WHEEL_PYTHON" -m gformbot --version
          PATH="" "$WHEEL_PYTHON" -m gformbot --help
          for command in generate prepare preview doctor config log; do
            "$WHEEL_PYTHON" -m gformbot "$command" --help
          done
          "$WHEEL_PYTHON" -m gformbot doctor --check
          "$WHEEL_PYTHON" -m pip install pytest
          "$WHEEL_PYTHON" -m pytest -q gformbot-wheel-tests/test_transport.py gformbot-wheel-tests/test_editor.py gformbot-wheel-tests/test_chatgpt_http.py gformbot-wheel-tests/test_generation_recovery.py
      - name: Smoke-test the source archive outside the checkout
        shell: bash
        run: |
          SOURCE_FILE="$(python -c "from pathlib import Path; print(next(Path('dist').glob('*.tar.gz')).resolve())")"
          python -m venv "$RUNNER_TEMP/gformbot-source"
          if [ "$RUNNER_OS" = "Windows" ]; then
            SOURCE_PYTHON="$RUNNER_TEMP/gformbot-source/Scripts/python.exe"
          else
            SOURCE_PYTHON="$RUNNER_TEMP/gformbot-source/bin/python"
          fi
          cd "$RUNNER_TEMP"
          "$SOURCE_PYTHON" -m pip install "$SOURCE_FILE"
          "$SOURCE_PYTHON" -m pip check
          "$SOURCE_PYTHON" -m gformbot --version
          "$SOURCE_PYTHON" -m gformbot doctor --check
